<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Finanzen"><meta name="theme-color" content="#0b0d10"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png"><link rel="manifest" href="manifest.json"></head><body><title>Checkmate Finanzkonsole</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky top bar + left rail + content column; rail collapses to a drawer under 860px */
:root{
  --bg:#F1F2EF; --surface:#FBFBF9; --surface-2:#E9EAE6; --border:#DCDED8; --border-strong:#C3C7BE;
  --fg:#14181A; --muted:#5C6361; --faint:#89908D;
  --accent:#8A6A2F; --accent-soft:#F0E7D5; --accent-line:#D8C49A; --on-accent:#FFFFFF;
  --pos:#2E7A4F; --neg:#AE3229; --warn:#8C6207;
  --pos-soft:#DFEDE4; --neg-soft:#F7E1DE; --warn-soft:#F7ECD4;
  --shadow:0 1px 2px rgba(20,24,26,.05),0 10px 28px -20px rgba(20,24,26,.35);
  --r:10px;
  --f-display:Arial,-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-ui:Arial,-apple-system,"Segoe UI",system-ui,sans-serif;
  --f-num:Arial,-apple-system,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0E0F; --surface:#131718; --surface-2:#1B2021; --border:#262C2D; --border-strong:#3A4142;
  --fg:#E8EBE8; --muted:#929A97; --faint:#6D7572;
  --accent:#D4AA62; --accent-soft:#2A2317; --accent-line:#4A3D23; --on-accent:#171B1C;
  --pos:#5CBE84; --neg:#E8766A; --warn:#E0AC45;
  --pos-soft:#15251C; --neg-soft:#2B1715; --warn-soft:#272013;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px -20px rgba(0,0,0,.9);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0E0F; --surface:#131718; --surface-2:#1B2021; --border:#262C2D; --border-strong:#3A4142;
  --fg:#E8EBE8; --muted:#929A97; --faint:#6D7572;
  --accent:#D4AA62; --accent-soft:#2A2317; --accent-line:#4A3D23; --on-accent:#171B1C;
  --pos:#5CBE84; --neg:#E8766A; --warn:#E0AC45;
  --pos-soft:#15251C; --neg-soft:#2B1715; --warn-soft:#272013;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px -20px rgba(0,0,0,.9);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:600;letter-spacing:-.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar-in{max-width:1340px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;margin-right:4px}
.brand-mark{width:28px;height:28px;display:grid;place-items:center;border:1px solid var(--accent-line);border-radius:7px;color:var(--accent);font-size:16px;line-height:1;flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:15px;line-height:1.15;white-space:nowrap}
.brand em{display:block;font-style:normal;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.areas{display:flex;gap:2px;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:2px;overflow-x:auto;scrollbar-width:none}
.areas::-webkit-scrollbar{display:none}
.areas button{border:0;background:transparent;border-radius:7px;padding:5px 11px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:13px}
.areas button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.sel{display:flex;align-items:center;gap:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.sel select{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:13px;letter-spacing:0;text-transform:none;color:var(--fg)}
.icon-btn{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:13px}
.icon-btn:hover{color:var(--fg);border-color:var(--border-strong)}
.menu-btn{display:none}
@media(max-width:860px){.menu-btn{display:grid}}

/* shell */
.shell{max-width:1340px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:30px;padding-block:24px 72px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);align-self:start}
.rail h4{margin:16px 0 6px;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);font-family:var(--f-ui);font-weight:600}
.rail h4:first-child{margin-top:0}
.rail a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:8px;color:var(--muted);text-decoration:none;cursor:pointer}
.rail a:hover{background:var(--surface-2);color:var(--fg)}
.rail a[aria-current="page"]{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:var(--shadow)}
tbody tr:has(button[data-act^="edit"]){cursor:pointer}tbody tr:has(button[data-act^="edit"]):hover td{background:var(--surface-2)}
details.adv{margin:4px 0 12px}details.adv summary{cursor:pointer;color:var(--muted);font-size:13px;padding:6px 0}
.rail details.more summary{padding:7px 10px;color:var(--faint);cursor:pointer;font-size:13px}
.rail details.more[open] summary{margin-bottom:2px}
.rail a.soon{opacity:.5;cursor:default}
.rail a.soon:hover{background:transparent;color:var(--muted)}
.soon-tag{font-size:9px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--border);border-radius:5px;padding:1px 4px;color:var(--faint)}
@media(max-width:860px){.shell{grid-template-columns:minmax(0,1fr);gap:18px}.rail{display:none;position:static;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px}.rail.open{display:block}}

/* content */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:26px}
.eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.lede{color:var(--muted);max-width:62ch;margin:6px 0 0}
.btn{background:var(--accent);color:var(--on-accent);border:1px solid transparent;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--border-strong)}
.btn.ghost:hover{filter:none;background:var(--surface-2)}
.btn.danger{background:transparent;color:var(--neg);border-color:var(--neg)}
.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 15px;min-width:0}
.tile .k{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.tile .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:21px;line-height:1.1;letter-spacing:-.02em;word-break:break-word}
.tile .s{font-size:12px;color:var(--muted);margin-top:5px}
.tile.lead{background:var(--accent-soft);border-color:var(--accent-line)}
.tile.lead .v{color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card>h3{font-size:16px;margin-bottom:3px}
.card>.hint{color:var(--muted);font-size:13px;margin:0 0 14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-head h3{font-size:16px}

table{width:100%;border-collapse:collapse}
.tw{overflow-x:auto;margin:0 -16px;padding:0 16px}
th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:0 10px 8px 0;white-space:nowrap}
td{padding:9px 10px 9px 0;border-top:1px solid var(--border);vertical-align:middle}
td.r,th.r{text-align:right;padding-right:0;padding-left:18px}
.nw{white-space:nowrap}
tbody tr:hover{background:var(--surface-2)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.03em;border-radius:20px;padding:2px 9px;white-space:nowrap}
.pill.ok{background:var(--pos-soft);color:var(--pos)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--neg-soft);color:var(--neg)}
.pill.neutral{background:var(--surface-2);color:var(--muted)}
.tag{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:1px 5px;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}

.meter{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.meter i.good{background:var(--pos)}.meter i.warn{background:var(--warn)}.meter i.bad{background:var(--neg)}
.meter-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:baseline;margin-bottom:9px}
.meter-row .lbl{font-size:12px;color:var(--muted)}
.meter-row .val{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:12px}
.meter-row .meter{grid-column:1/-1}

.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;align-items:start}
.unit{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px;min-width:0;display:flex;flex-direction:column;gap:10px}
.unit.alert{border-color:var(--neg)}
.unit-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.unit-top h4{margin:0;font-family:var(--f-display);font-size:16px;font-weight:600}
.unit-meta{font-size:12px;color:var(--muted);margin-top:2px}
.unit-figs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fig .k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.fig .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:16px;margin-top:2px}
.unit-actions{display:flex;gap:6px;margin-top:auto;padding-top:4px}

.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--border-strong);border-radius:8px;padding:8px 10px}
.field input:focus,.field select:focus{border-color:var(--accent)}
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.filters select{background:var(--bg);border:1px solid var(--border-strong);border-radius:8px;padding:5px 9px;max-width:100%}
.fcount{margin-left:auto;font-size:12px;color:var(--muted)}
@media(max-width:620px){.fcount{margin-left:0}}
.checks{display:flex;flex-direction:column;gap:9px;margin-bottom:14px}
.checks label{display:flex;align-items:center;gap:9px;cursor:pointer}
.checks input{width:17px;height:17px;accent-color:var(--accent);flex:none}
.field .help{font-size:12px;color:var(--muted);margin-top:4px;text-transform:none;letter-spacing:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}.unit-figs{grid-template-columns:1fr}.tile .v{font-size:19px}}

.empty{text-align:center;padding:34px 16px;border:1px dashed var(--border-strong);border-radius:var(--r);color:var(--muted)}
.empty h3{font-size:17px;margin-bottom:6px;color:var(--fg)}
.empty p{margin:0 auto 14px;max-width:46ch}

.notice{display:flex;gap:10px;background:var(--warn-soft);border:1px solid var(--warn);border-radius:var(--r);padding:11px 13px;margin-bottom:14px;font-size:13px}
.notice.info{background:var(--accent-soft);border-color:var(--accent-line)}
.notice b{display:block}

/* modal + wizard + toast */
[hidden]{display:none!important}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:6px}
.cal .dow{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:center;padding:2px 0}
.cal .day[data-d]{cursor:pointer}.cal .day{min-height:78px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px;font-size:11px;overflow:hidden;min-width:0}
.cal .day.mute{background:transparent;border-color:transparent}
.cal .day.today{border-color:var(--accent)}
.cal .day.win{background:var(--pos-soft)}.cal .day.loss{background:var(--neg-soft)}
.cal .n{color:var(--faint);font-size:11px}
.cal .ev{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;margin-top:2px;padding:1px 4px;border-radius:4px;background:var(--surface-2)}
.cal .ev.debt{background:var(--neg-soft);color:var(--neg)}.cal .ev.open{background:var(--warn-soft);color:var(--warn)}.cal .ev.goal{background:var(--pos-soft);color:var(--pos)}
@media(max-width:620px){.cal{gap:2px}.cal .day{min-height:54px;padding:3px}.cal .ev{font-size:9px;padding:0 2px}}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,13,14,.55);display:grid;place-items:center;padding:18px;overflow:auto}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);padding:20px;max-height:calc(100vh - 36px);overflow:auto}
.sheet h3{font-size:19px;margin-bottom:4px}
.sheet .hint{color:var(--muted);font-size:13px;margin:0 0 16px}
.sheet-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.wrap-wizard{min-height:100%;display:grid;place-items:center;padding:26px max(16px,env(safe-area-inset-left,0px))}
.wizard-card{width:min(520px,100%);background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:24px}
.wiz-logo{display:block;width:118px;height:118px;max-width:100%;border-radius:50%;margin:0 auto 14px;border:1px solid var(--accent-line)}
.wiz-brand{text-align:center;margin-bottom:22px}
.wiz-brand b{display:block;font-family:var(--f-display);font-size:21px;letter-spacing:.02em}
.wiz-brand em{display:block;font-style:normal;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-top:4px}
.wiz-tag{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--fg);color:var(--bg);border-radius:9px;padding:9px 15px;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media(prefers-reduced-motion:no-preference){.toast{animation:rise .18s ease-out}@keyframes rise{from{opacity:0;transform:translate(-50%,8px)}}}
.fineprint{color:var(--faint);font-size:12px;margin-top:22px;border-top:1px solid var(--border);padding-top:14px}
/* ---- peppiger Look: Bereichsfarben, Verläufe, Bewegung ---- */
:root{--area:var(--accent);--on-area:var(--on-accent)}
body[data-area="priv"]{--area:#14A383;--on-area:#fff}
body[data-area="biz"]{--area:#7A68F2;--on-area:#fff}
body[data-area="crypto"]{--area:#F0883E;--on-area:#fff}
body{background:radial-gradient(900px 420px at 85% -120px,color-mix(in srgb,var(--area) 16%,transparent),transparent),radial-gradient(700px 360px at -10% 30%,color-mix(in srgb,var(--area) 7%,transparent),transparent),var(--bg);background-attachment:fixed}
.topbar{border-bottom:0;box-shadow:0 2px 0 0 var(--area)}
.brand-mark{background:linear-gradient(135deg,color-mix(in srgb,var(--area) 30%,transparent),transparent);border-color:var(--area)}
.btn{background:linear-gradient(135deg,var(--area),color-mix(in srgb,var(--area) 72%,#000));color:var(--on-area);border-radius:10px;font-weight:600;box-shadow:0 4px 14px -6px var(--area);transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface);color:var(--fg);box-shadow:none}
.btn.danger{background:transparent;color:var(--neg);box-shadow:none}
.btn[data-type="in"]{background:linear-gradient(135deg,var(--pos),color-mix(in srgb,var(--pos) 70%,#000));color:#fff;box-shadow:0 4px 14px -6px var(--pos)}
.btn[data-type="out"]{background:linear-gradient(135deg,var(--neg),color-mix(in srgb,var(--neg) 70%,#000));color:#fff;box-shadow:0 4px 14px -6px var(--neg)}
.areas button[aria-pressed="true"]{background:var(--area);color:var(--on-area);box-shadow:0 2px 10px -4px var(--area)}
#areaTabs button[data-area="all"][aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
#areaTabs button[data-area="trade"][aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
#areaTabs button[data-area="priv"][aria-pressed="true"]{background:#14A383;color:#fff}
#areaTabs button[data-area="biz"][aria-pressed="true"]{background:#7A68F2;color:#fff}
#areaTabs button[data-area="crypto"][aria-pressed="true"]{background:#F0883E;color:#fff}
.rail a{justify-content:flex-start;gap:9px;transition:background .15s,transform .15s}
.rail a:hover{transform:translateX(2px)}
.rail a[aria-current="page"]{background:color-mix(in srgb,var(--area) 15%,var(--surface));box-shadow:inset 3px 0 0 var(--area)}
.rail .ic{width:20px;text-align:center;font-size:15px;flex:none}
.rail h4{color:var(--area)}
.page-head h1{font-size:30px}
.eyebrow{color:var(--area);font-weight:600}
.tile{border-top:3px solid color-mix(in srgb,var(--area) 55%,transparent);transition:transform .2s,box-shadow .2s;box-shadow:var(--shadow)}
.tile:hover{transform:translateY(-3px)}
.tile .v{font-size:24px}
.tile.lead{background:linear-gradient(135deg,color-mix(in srgb,var(--area) 24%,var(--surface)),var(--surface) 85%);border-color:color-mix(in srgb,var(--area) 50%,var(--border));border-top-width:3px}
.tile.lead .v{color:var(--area);font-size:30px}
.card{border-radius:14px;box-shadow:var(--shadow)}
.meter{height:7px;border-radius:4px}
.meter i:not(.good):not(.warn):not(.bad){background:linear-gradient(90deg,color-mix(in srgb,var(--area) 60%,#fff),var(--area))}
.pill{padding:3px 10px}
.cal .day.today{border-color:var(--area);box-shadow:0 0 0 1px var(--area)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:no-preference){#view>*{animation:rise .4s ease both}#view>*:nth-child(2){animation-delay:.05s}#view>*:nth-child(3){animation-delay:.1s}#view>*:nth-child(4){animation-delay:.15s}}
@media (prefers-reduced-motion:reduce){.tile,.btn,.rail a{transition:none}}

/* beide Modi: Kennzahlen brechen nicht um */
.tile .v{white-space:nowrap}
.tile.lead .v{font-size:clamp(22px,2.6vw,30px)}
.pill.imp{color:color-mix(in srgb,var(--c) 62%,var(--fg))}

/* ---- heller Modus v2: luftig, flache Farben, weiche Karten ---- */
html.lt{--bg:#F5F6FA;--surface:#FFFFFF;--surface-2:#EEF0F6;--border:#E3E6EE;--border-strong:#C9CED9;--fg:#141A26;--muted:#566074;--faint:#7A8497;
  --accent:#A86A0C;--accent-soft:#FBF1DE;--accent-line:#E6C98F;--pos:#17803F;--neg:#C42B2B;--warn:#9A6200;--pos-soft:#DDF3E5;--neg-soft:#FCE4E4;--warn-soft:#FCEFD2;

function rate(c){var r=S.settings.rates[c];return (typeof r==="number"&&r>0)?r:(c===S.settings.home?1:0)}
function conv(a,from,to){if(from===to)return a;var rf=rate(from),rt=rate(to);if(!rf||!rt)return null;return a*rf/rt}
function fmt(a,c){if(a===null||a===undefined||isNaN(a))return "—";
  try{return new Intl.NumberFormat(S.settings.lang==="de"?"de-DE":"en-US",{style:"currency",currency:c,maximumFractionDigits:2}).format(a)}
  catch(e){return a.toFixed(2)+" "+c}}
function pct(x){return (Math.round(x*10)/10).toFixed(1)+" %"}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}
function uid(){return "u"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){return new Date().toISOString().slice(0,10)}

/* ---------- model helpers ---------- */
var KINDS=[{k:"priv",area:"priv"},{k:"wallet",area:"crypto"},{k:"cash",area:"trade"},{k:"biz",area:"biz"}];
function areaOf(kind){for(var i=0;i<KINDS.length;i++)if(KINDS[i].k===kind)return KINDS[i].area;return "priv"}
function kindLabel(k){return t("k_"+k)}
var KORDER={priv:0,wallet:0.5,cash:1,biz:2};
function unitsIn(area){var on=onAreas();
  return S.units.filter(function(u){var ua=areaOf(u.kind);return on.indexOf(ua)>=0&&(area==="all"||ua===area)})
  .sort(function(x,y){return (KORDER[x.kind]||0)-(KORDER[y.kind]||0)})}
function num(x){var n=parseFloat(x);return isNaN(n)?0:n}


/* ---------- chrome ---------- */
function onAreas(){var a=S.settings.areas||{};return ["priv","trade","crypto","biz"].filter(function(x){return a[x]!==false})}
function tradeVisible(){return onAreas().indexOf("trade")>=0&&(state.area==="all"||state.area==="trade")}
function areaList(){var on=onAreas();return (on.length>1?["all"]:[]).concat(on)}
var state={area:"all",page:"overview",tf:"all",tu:""};
function applyTheme(){
  var th=S.settings.theme;
  if(th==="auto")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",th);
  var lt=th==="light"||(th!=="dark"&&!(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches));
  document.documentElement.classList.toggle("lt",lt);
  document.getElementById("themeBtn").textContent= th==="dark"?"☀":"☽";
}
function toast(msg){var el=document.getElementById("toast");el.textContent=msg;el.hidden=false;
  clearTimeout(el._t);el._t=setTimeout(function(){el.hidden=true},2200)}

function renderChrome(){
  document.getElementById("brandName").textContent=S.settings.brand||"Checkmate";
  document.getElementById("brandSub").textContent=S.settings.sub||"Organisation";
  document.getElementById("curLbl").textContent=t("display");
  document.getElementById("langBtn").textContent=S.settings.lang==="de"?"EN":"DE";
  var at=document.getElementById("areaTabs");
  var AREAS=areaList();
  if(AREAS.indexOf(state.area)<0)state.area=AREAS[0];
  at.hidden=AREAS.length<2;
  at.innerHTML=AREAS.map(function(a){
    return '<button type="button" data-area="'+a+'" aria-pressed="'+(state.area===a)+'">'+esc(t("a_"+a))+'</button>';
  }).join("");
  var sel=document.getElementById("dispCur");
  var list=Object.keys(S.settings.rates);
  if(list.indexOf(S.settings.home)<0)list.unshift(S.settings.home);
  sel.innerHTML=list.map(function(c){return '<option value="'+c+'"'+(c===state.cur?" selected":"")+'>'+c+'</option>'}).join("");
  sel.value=state.cur;
  var NAV=[{a:"priv",top:["inout","fixed","saving","nw"]},{a:"trade",top:["credit","tradelog","eval","plan","diary"]},{a:"biz",top:["inout","reports"]}];
  var PL={budget:"t_budget",inout:"t_inout",nw:"t_nw",reports:"t_reports",tradelog:"t_tradelog",credit:"t_credit",eval:"g_eval",plan:"g_plan",diary:"g_diary",fixed:"g_fixed",saving:"g_saving",wallet:"t_wallet"};
  function lk(x){return '<a data-page="'+x+'" '+(state.page===x?'aria-current="page"':'')+'>'+esc(t((x==="inout"&&state.area==="biz")?"t_inout_biz":PL[x]))+'</a>'}
  var html=state.area==="biz"?'':'<a data-page="overview" '+(state.page==="overview"?'aria-current="page"':'')+'>'+esc(t("overview"))+'</a>'+
    '<a data-page="accounts" '+(state.page==="accounts"?'aria-current="page"':'')+'>'+esc(t("accounts"))+'</a>';
  if(state.area==="all")html+='<p class="hint" style="margin:14px 10px 0">'+esc(t("pick_area"))+'</p>';
  else NAV.forEach(function(g){if(g.a!==state.area||!areaOk(g.a))return;
    html+='<h4>'+esc(t("a_"+g.a))+'</h4>'+g.top.map(lk).join("")});
  html+='<h4>'+esc(t("nav_more"))+'</h4>'+
    '<a data-page="currencies" '+(state.page==="currencies"?'aria-current="page"':'')+'>'+esc(t("currencies"))+'</a>'+
    '<a data-page="settings" '+(state.page==="settings"?'aria-current="page"':'')+'>'+esc(t("settings"))+'</a>';
  var ICON={overview:"\uD83C\uDFE0",accounts:"\uD83C\uDFE6",currencies:"\uD83D\uDCB1",settings:"\u2699\uFE0F",inout:"\uD83E\uDDFE",budget:"\uD83C\uDFAF",saving:"\uD83D\uDCB0",fixed:"\uD83D\uDD01",nw:"\uD83D\uDC8E",wallet:"\uD83E\uDE99",reports:"\uD83D\uDCCA",tradelog:"\uD83D\uDCD2",eval:"\uD83D\uDCC8",credit:"\uD83C\uDF81",plan:"\uD83E\uDDED",diary:"\u270D\uFE0F"};
  html=html.replace(/(<a data-page="(\w+)"[^>]*>)/g,function(m,a,pg){return a+(ICON[pg]?'<span class="ic">'+ICON[pg]+'</span>':'')});
  document.getElementById("rail").innerHTML=html;
}

var PRESET={};
function quickActions(){
  var all=state.area==="all",b=[];
  if(all)return "";
  function btn(act,attrs,label,pre){return '<button class="btn" data-act="'+act+'"'+attrs+'>'+esc((all&&pre?t("a_"+pre)+": ":"")+label)+'</button>'}
  if(areaOk("priv")){b.push(btn("addrec",' data-c="tx" data-area="priv" data-type="out"',t("qa_exp"),"priv"));b.push(btn("addrec",' data-c="tx" data-area="priv" data-type="in"',t("qa_inc"),"priv"))}
  if(areaOk("trade")){b.push(btn("addtrade","",t("qa_trade"),"trade"));if(cashUnits().length)b.push(btn("adddep","",t("qa_dep"),"trade"))}
  b.push('<button class="btn ghost" data-act="add">'+esc(t("add_unit"))+'</button>');
  return '<div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:18px">'+b.join("")+'</div>';
}
function lotsF(n){return new Intl.NumberFormat(S.settings.lang==="de"?"de-DE":"en-US",{maximumFractionDigits:2}).format(n)}
function bizTotals(){
  var l=S.tx.filter(function(x){return x.area==="biz"}),pd=l.filter(function(x){return x.paid!=="open"});
  var inc=sumCv(pd.filter(function(x){return x.type==="in"}),txAmt),lots=l.reduce(function(a,x){return a+num(x.lots)},0);
  return tile(t("revenue"),'<span class="pos">'+esc(fmt(inc,state.cur))+'</span>',"",true)+tile(t("f_lots"),esc(lotsF(lots)))}
function bizLotsTile(){
  var m={};S.tx.forEach(function(x){if(x.area==="biz"&&num(x.lots)>0){var k=ymOf(x.date);m[k]=(m[k]||0)+num(x.lots)}});
  var ks=Object.keys(m).sort();if(!ks.length)return"";
  var k=ks[ks.length-1];
  return tile(t("f_lots")+" · "+monthName(k),esc(lotsF(m[k])),"",true)}

  var inc=sumCv(l.filter(function(x){return x.type==="in"}),txAmt),out=sumCv(lo,txAmt)+fmo.open;

/* ---------- trades: helpers ---------- */
function cashUnits(){return S.units.filter(function(u){return u.kind==="cash"})}
function unitById(id){for(var i=0;i<S.units.length;i++)if(S.units[i].id===id)return S.units[i];return null}
function fxOf(tr){var f=parseFloat(tr.fx);if(f>0)return f;return rate(tr.cur||S.settings.home)||0}
function tCur(uid){var us=cashUnits().filter(function(u){return !uid||u.id===uid});if(!us.length)return state.cur;var c=us[0].currency;return us.every(function(u){return u.currency===c})?c:state.cur}
function pnlIn(tr,cur){var tcu=tr.cur||(unitById(tr.unit)||{}).currency;if(tcu&&tcu===cur)return num(tr.pnl);var rt=rate(cur),fx=fxOf(tr);if(!rt||!fx){MISS=true;return null}return num(tr.pnl)*fx/rt}
function resultOf(tr){var v=num(tr.pnl);return v>0?"win":v<0?"loss":"be"}
function calcR(tr){
  var e=parseFloat(tr.entry),sl=parseFloat(tr.sl),x=parseFloat(tr.exit);
  if(isNaN(e)||isNaN(sl)||isNaN(x))return "";
  var risk=Math.abs(e-sl);if(!risk)return "";
  var move=(tr.dir==="short")?(e-x):(x-e);
  return String(Math.round(move/risk*100)/100);
}
function tradeCalc(){
  var box=document.getElementById("t_calc");if(!box)return;
  var tr={dir:val("t_dir"),entry:val("t_entry"),sl:val("t_sl"),exit:val("t_exit")},R=calcR(tr),pn=parseFloat(val("t_pnl")),u=unitById(val("t_unit")),id=val("t_id"),own=0;
  if(id){S.trades.forEach(function(x){if(x.id===id)own=num(x.pnl)})}
  var base=u?bal(u)-own:0,de=S.settings.lang==="de",parts=[];
  parts.push('<span class="hint" style="margin:0">'+(de?"Wird berechnet":"Calculated")+'</span>');
  if(!isNaN(pn)&&u&&base>0)parts.push('<b>'+(de?"Konto":"Account")+'</b> '+(pn>0?"+":"")+(Math.round(pn/base*10000)/100).toString().replace(".",de?",":".")+' %');
  if(!isNaN(pn))parts.push('<b>'+(de?"Ergebnis":"Result")+'</b> '+(pn>0?(de?"Gewinner":"Winner"):pn<0?(de?"Verlierer":"Loser"):"Break-even"));
  box.innerHTML=parts.join(' &nbsp;·&nbsp; ')}
function uniq(key){var o={},out=[];S.trades.forEach(function(t){var v=(t[key]||"").trim();if(v&&!o[v]){o[v]=1;out.push(v)}});return out.sort()}
function dlist(id,vals){return '<datalist id="'+id+'">'+vals.map(function(v){return '<option value="'+esc(v)+'">'}).join("")+'</datalist>'}
function allTrades(){
  var ids={};cashUnits().forEach(function(u){ids[u.id]=1});
  return S.trades.filter(function(t){return ids[t.unit]}).slice().sort(function(a,b){return (a.date<b.date?1:a.date>b.date?-1:0)});
}

function filteredTrades(){
  var ts=allTrades();
  if(state.tu)ts=ts.filter(function(t){return t.unit===state.tu});
  var m=today().slice(0,7);
  if(state.tf==="month")ts=ts.filter(function(t){return (t.date||"").slice(0,7)===m});
  if(state.tf==="win")ts=ts.filter(function(t){return resultOf(t)==="win"});
  if(state.tf==="loss")ts=ts.filter(function(t){return resultOf(t)==="loss"});
  return ts;
}

/* ---------- performance maths ---------- */
function perf(trs,cur){
  var asc=trs.slice().sort(function(a,b){return (a.date>b.date?1:a.date<b.date?-1:0)});
  var o={n:asc.length,wins:0,losses:0,be:0,gp:0,gl:0,net:0,largestWin:0,largestLoss:0,
         maxWinStreak:0,maxLossStreak:0,maxDD:0,avgR:null,curve:[],months:{}};
  var cw=0,cl=0,cum=0,peak=0,rs=[];
  asc.forEach(function(t){
    var v=pnlIn(t,cur);if(v===null)v=0;
    var res=resultOf(t);
    if(res==="win"){o.wins++;o.gp+=v;cw++;cl=0;if(v>o.largestWin)o.largestWin=v}
    else if(res==="loss"){o.losses++;o.gl+=Math.abs(v);cl++;cw=0;if(v<o.largestLoss)o.largestLoss=v}
    else{o.be++;cw=0;cl=0}
    if(cw>o.maxWinStreak)o.maxWinStreak=cw;
    if(cl>o.maxLossStreak)o.maxLossStreak=cl;
    cum+=v;if(cum>peak)peak=cum;
    if(peak-cum>o.maxDD)o.maxDD=peak-cum;
    o.curve.push({d:t.date||"",y:cum});
    var mk=(t.date||"").slice(0,7)||"—";
    if(!o.months[mk])o.months[mk]={pnl:0,n:0,w:0};
    o.months[mk].pnl+=v;o.months[mk].n++;if(res==="win")o.months[mk].w++;
    var r=parseFloat(t.r);if(!isNaN(r))rs.push(r);
  });
  o.net=o.gp-o.gl;
  o.winRate=o.n?o.wins/o.n*100:0;
  o.pf=o.gl>0?o.gp/o.gl:(o.gp>0?null:0);
  o.exp=o.n?o.net/o.n:0;
  o.avgWin=o.wins?o.gp/o.wins:0;
  o.avgLoss=o.losses?o.gl/o.losses:0;
  o.avgR=rs.length?rs.reduce(function(a,b){return a+b},0)/rs.length:null;
  return o;
}
function groupBy(trs,key,cur){
  var g={};
  trs.forEach(function(t){
    var k=(key==="dow")?["So","Mo","Di","Mi","Do","Fr","Sa"][new Date(t.date+"T12:00:00").getDay()||0]:((t[key]||"").trim()||"—");
    if(key==="dow"&&S.settings.lang==="en")k=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(t.date+"T12:00:00").getDay()||0];
    if(!g[k])g[k]={n:0,w:0,net:0};
    g[k].n++;if(resultOf(t)==="win")g[k].w++;
    var v=pnlIn(t,cur);g[k].net+=(v===null?0:v);
  });
  return Object.keys(g).sort(function(a,b){return g[b].net-g[a].net}).map(function(k){return{k:k,v:g[k]}});
}

/* ---------- charts ---------- */
function chartEquity(curve,cur){
  if(curve.length<2)return '<p class="hint" style="margin:0">'+esc(t("need_two"))+'</p>';
  var W=Math.max(300,Math.min(640,((document.getElementById("view")||document.body).clientWidth||640)-64)),H=210,L=66,R=14,T=14,B=26;
  var ys=curve.map(function(p){return p.y}),lo=Math.min.apply(null,ys.concat([0])),hi=Math.max.apply(null,ys.concat([0]));
  if(hi===lo){hi=lo+1}
  var pad=(hi-lo)*0.08;lo-=pad;hi+=pad;
  var px=function(i){return L+(W-L-R)*(curve.length===1?0:i/(curve.length-1))};
  var py=function(v){return T+(H-T-B)*(1-(v-lo)/(hi-lo))};
  var g='',ticks=4;
  for(var i=0;i<=ticks;i++){
    var v=lo+(hi-lo)*i/ticks,y=py(v);
    g+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="var(--border)" stroke-width="1"/>'+
       '<text x="'+(L-8)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="10" fill="var(--faint)" font-family="var(--f-num)">'+esc(shortNum(v))+'</text>';
  }
  if(lo<0&&hi>0)g+='<line x1="'+L+'" y1="'+py(0).toFixed(1)+'" x2="'+(W-R)+'" y2="'+py(0).toFixed(1)+'" stroke="var(--border-strong)" stroke-width="1.5"/>';
  var d=curve.map(function(p,i){return (i?"L":"M")+px(i).toFixed(1)+" "+py(p.y).toFixed(1)}).join(" ");
  var area=d+" L"+px(curve.length-1).toFixed(1)+" "+py(Math.max(lo,0)).toFixed(1)+" L"+px(0).toFixed(1)+" "+py(Math.max(lo,0)).toFixed(1)+" Z";
  var hit='';
  curve.forEach(function(p,i){
    var w=(W-L-R)/curve.length;
    hit+='<rect x="'+(px(i)-w/2).toFixed(1)+'" y="'+T+'" width="'+w.toFixed(1)+'" height="'+(H-T-B)+'" fill="transparent"><title>'+
      esc((p.d||"")+"  "+fmt(p.y,cur))+'</title></rect>';
  });
  var last=curve[curve.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="'+esc(t("equity"))+'">'+
    g+'<path d="'+area+'" fill="var(--accent)" opacity="0.10"/>'+
    '<path d="'+d+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+px(curve.length-1).toFixed(1)+'" cy="'+py(last.y).toFixed(1)+'" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>'+
    '<text x="'+L+'" y="'+(H-8)+'" font-size="10" fill="var(--faint)" font-family="var(--f-num)">'+esc(curve[0].d)+'</text>'+
    '<text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" font-size="10" fill="var(--faint)" font-family="var(--f-num)">'+esc(last.d)+'</text>'+
    hit+'</svg>';
}
function chartMonths(months,cur){
  var keys=Object.keys(months).sort();
  if(!keys.length)return '';
  keys=keys.slice(-12);
  var W=Math.max(300,Math.min(640,((document.getElementById("view")||document.body).clientWidth||640)-64)),H=180,L=66,R=14,T=12,B=30;
  var vals=keys.map(function(k){return months[k].pnl});
  var lo=Math.min.apply(null,vals.concat([0])),hi=Math.max.apply(null,vals.concat([0]));
  if(hi===lo)hi=lo+1;
  var py=function(v){return T+(H-T-B)*(1-(v-lo)/(hi-lo))};
  var bw=(W-L-R)/keys.length, inner=Math.min(34,bw-6);
  var zero=py(0),out='';
  [lo,(lo+hi)/2,hi].forEach(function(v){
    var y=py(v);
    out+='<line x1="'+L+'" y1="'+y.toFixed(1)+'" x2="'+(W-R)+'" y2="'+y.toFixed(1)+'" stroke="var(--border)" stroke-width="1"/>'+
      '<text x="'+(L-8)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="10" fill="var(--faint)" font-family="var(--f-num)">'+esc(shortNum(v))+'</text>';
  });
  keys.forEach(function(k,i){
    var v=months[k].pnl,x=L+bw*i+(bw-inner)/2,y=Math.min(py(v),zero),h=Math.abs(py(v)-zero);
    out+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+inner.toFixed(1)+'" height="'+Math.max(2,h).toFixed(1)+'" rx="2" '+
      'fill="'+(v<0?"var(--neg)":"var(--pos)")+'"><title>'+esc(k+"  "+fmt(v,cur)+"  ·  "+months[k].n+" Trades")+'</title></rect>'+
      '<text x="'+(x+inner/2).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="9" fill="var(--faint)" font-family="var(--f-num)">'+esc(k.slice(2))+'</text>';
  });
  out+='<line x1="'+L+'" y1="'+zero.toFixed(1)+'" x2="'+(W-R)+'" y2="'+zero.toFixed(1)+'" stroke="var(--border-strong)" stroke-width="1.5"/>';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="'+esc(t("per_month"))+'">'+out+'</svg>';
}
function shortNum(v){
  var a=Math.abs(v);
  if(a>=1e6)return (v/1e6).toFixed(1)+"M";
  if(a>=1e3)return (v/1e3).toFixed(1)+"k";
  return String(Math.round(v));
}

function depSorted(unit){return S.deposits.map(function(d,i){return{d:d,i:i}}).filter(function(x){return x.d.unit===unit})
  .sort(function(a,b){return a.d.date<b.d.date?-1:a.d.date>b.d.date?1:a.i-b.i}).map(function(x){return x.d})}
function isFirstDep(unit,id,date){
  var l=depSorted(unit).filter(function(d){return d.id!==id});
  for(var i=0;i<l.length;i++)if(l[i].date<=date)return false;
  return true;
}
function creditFor(unit,id,date,amount,kind){
  var c={first:150,next:50};
  var k=kind||(isFirstDep(unit,id,date)?"first":"next");
  var pct=k==="first"?num(c.first):num(c.next);
  return Math.round(amount*pct)/100;
}

  var c=conv(num(d.credit),u.currency,cur);if(c!==null)sum+=c});return sum}

function simDebts(list,extra,mode){
  var d=list.map(function(x){return{n:x.n,b:x.b,r:x.r/1200,m:x.m,at:0}}),months=0,interest=0;
  while(months<1200&&d.some(function(x){return x.b>0.005})){
    months++;
    var pool=(mode==="min")?0:extra;
    d.forEach(function(x){if(x.b>0.005){var i=x.b*x.r;x.b+=i;interest+=i}else if(mode!=="min")pool+=x.m});
    d.forEach(function(x){if(x.b>0.005){var p=Math.min(x.m,x.b);x.b-=p;if(mode!=="min")pool+=x.m-p}});
    if(mode!=="min"){
      var act=d.filter(function(x){return x.b>0.005});
      act.sort(mode==="avalanche"?function(a,b){return b.r-a.r}:function(a,b){return a.b-b.b});
      act.forEach(function(x){var p=Math.min(pool,x.b);x.b-=p;pool-=p});
    }
    d.forEach(function(x){if(x.b<=0.005&&!x.at)x.at=months});
  }
  var ok=!d.some(function(x){return x.b>0.005});
  return{months:ok?months:null,interest:interest,list:d}
}

function revOf(u){
  var bz=S.units.filter(function(x){return x.kind==="biz"}),tot=0,nm=(u.name||"").toLowerCase(),fm=(u.firm||"").toLowerCase();
  S.tx.forEach(function(x){if(x.area!=="biz"||x.type!=="in"||x.paid==="open")return;

function privNet(cu){
  var tot=0;S.tx.forEach(function(x){if((x.area||"priv")!=="priv"||x.paid==="open")return;
    var f=x.cur||S.settings.home,v=conv(txAmt(x),f,cu);if(v===null){MISS=true;v=f===cu?txAmt(x):0}

    S.payouts.forEach(function(x){if(x.unit?x.unit!==u.id:!(fw&&fw.id===u.id))return;var f=x.cur||u.currency,v=conv(num(x.amount),f,u.currency);if(v===null){MISS=true;v=f===u.currency?num(x.amount):0}pd+=(x.wkind==='wout'?-v:v)});
    return{start:w0,dep:pd,tr:0,total:w0+pd}}
  if(u.kind==="priv"){var st0=num(u.balance),fp=firstPriv(),nt=(fp&&fp.id===u.id)?privNet(u.currency):0;return{start:st0,dep:0,tr:0,total:st0+nt}}
  if(u.kind==="biz"){var rv=revOf(u);return{start:0,dep:0,tr:0,total:rv}}
  var st=num(u.balance);if(u.kind!=="cash")return{start:st,dep:0,tr:0,total:st};st=0;

function syncSubs(){
  var done=S.settings.subDone=S.settings.subDone||{},td=today(),ch=false;
  S.subs.forEach(function(sb){
    var grp={};S.tx.forEach(function(x){if(x.auto===sb.id&&x.cost==="fix"){var k=subPer(sb,x.date);(grp[k]=grp[k]||[]).push(x)}});

      if(keep.length===g.length)return;S.tx=S.tx.filter(function(x){return g.indexOf(x)<0||keep.indexOf(x)>=0});ch=true});
  });
  S.subs.forEach(function(sb){

function doExport(){
  var data=JSON.stringify(S,null,2), fn=(S.settings.brand||"finanz").toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-"+today()+".json";
  var done=function(){toast(t("saved"))};
  var fallback=function(){
    try{var b=new Blob([data],{type:"application/json"});var a=document.createElement("a");
      a.href=URL.createObjectURL(b);a.download=fn;document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);done();
    }catch(e){toast("Export: "+e.message)}
  };
  if(window.claude&&window.claude.use){
    Promise.resolve(window.claude.use("downloads")).then(function(dl){
      if(dl&&dl.save){return Promise.resolve(dl.save({filename:fn,data:data})).then(done)}
      fallback();
    }).catch(fallback);
  } else fallback();
}

function csvParse(txt){
  txt=txt.replace(/^﻿/,"");var first=txt.split(/\r?\n/)[0]||"";
  var d=";",best=-1;[";",",","\t"].forEach(function(c){var n=first.split(c).length;if(n>best){best=n;d=c}});
  var rows=[],row=[],cur="",q=false;
  for(var i=0;i<txt.length;i++){var ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===d){row.push(cur);cur=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&txt[i+1]==="\n")i++;row.push(cur);cur="";if(row.some(function(x){return x.trim()!==""}))rows.push(row);row=[]}
    else cur+=ch}
  row.push(cur);if(row.some(function(x){return x.trim()!==""}))rows.push(row);
  return rows}
function csvNum(x){x=String(x||"").replace(/[^\d,.\-]/g,"");if(!x)return NaN;
  var lc=x.lastIndexOf(","),ld=x.lastIndexOf(".");
  if(lc>=0&&ld>=0)x=lc>ld?x.replace(/\./g,"").replace(",","."):x.replace(/,/g,"");
  else if(lc>=0)x=x.replace(",",".");
  return parseFloat(x)}
function csvDate(x){x=String(x||"").trim();var m;
  if((m=x.match(/^(\d{4})-(\d{2})-(\d{2})/)))return m[1]+"-"+m[2]+"-"+m[3];
  if((m=x.match(/^(\d{4})\.(\d{2})\.(\d{2})/)))return m[1]+"-"+m[2]+"-"+m[3];
  if((m=x.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{4})/)))return m[3]+"-"+("0"+m[2]).slice(-2)+"-"+("0"+m[1]).slice(-2);
  return ""}
function xlsxRows(file){
  return file.arrayBuffer().then(function(buf){
    var u=new Uint8Array(buf),dv=new DataView(buf),e=-1,i;
    for(i=u.length-22;i>=0;i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}
    if(e<0)throw new Error("kein xlsx");
    var n=dv.getUint16(e+10,true),off=dv.getUint32(e+16,true),ents={};
    for(i=0;i<n;i++){
      var nl=dv.getUint16(off+28,true),el=dv.getUint16(off+30,true),cl=dv.getUint16(off+32,true);
      var nm=new TextDecoder().decode(u.subarray(off+46,off+46+nl));
      ents[nm]={m:dv.getUint16(off+10,true),cs:dv.getUint32(off+20,true),lo:dv.getUint32(off+42,true)};
      off+=46+nl+el+cl}
    function get(nm){var z=ents[nm];if(!z)return Promise.resolve(null);
      var ln=dv.getUint16(z.lo+26,true),le=dv.getUint16(z.lo+28,true),st=z.lo+30+ln+le,d=u.subarray(st,st+z.cs);
      if(z.m===0)return Promise.resolve(new TextDecoder().decode(d));
      var ds=new DecompressionStream("deflate-raw");
      return new Response(new Blob([d]).stream().pipeThrough(ds)).text()}
    var sh=Object.keys(ents).filter(function(k){return /^xl\/worksheets\/sheet\d+\.xml$/.test(k)}).sort(function(a,b){return parseInt(a.replace(/\D/g,""))-parseInt(b.replace(/\D/g,""))})[0];
    if(!sh)throw new Error("kein xlsx");
    return Promise.all([get("xl/sharedStrings.xml"),get(sh)]).then(function(x){
      var P=new DOMParser(),ss=[];
      if(x[0]){var sd=P.parseFromString(x[0],"application/xml").getElementsByTagName("si");
        for(var k=0;k<sd.length;k++){var ts=sd[k].getElementsByTagName("t"),tx_="";for(var q=0;q<ts.length;q++)tx_+=ts[q].textContent;ss.push(tx_)}}
      var cells=P.parseFromString(x[1],"application/xml").getElementsByTagName("c"),rows=[];
      for(var c=0;c<cells.length;c++){var ce=cells[c],ref=ce.getAttribute("r")||"",ty=ce.getAttribute("t"),v=ce.getElementsByTagName("v")[0],val="";
        var m=ref.match(/^([A-Z]+)(\d+)$/);if(!m)continue;
        var col=0;for(var z=0;z<m[1].length;z++)col=col*26+m[1].charCodeAt(z)-64;col--;
        var ri=parseInt(m[2])-1;
        if(ty==="s")val=v?ss[+v.textContent]||"":"";
        else if(ty==="inlineStr")val=ce.textContent;
        else if(v){val=v.textContent;var nn=parseFloat(val);if(ty!=="str"&&nn>20000&&nn<80000&&/^\d+$/.test(val)){var dd=new Date(Date.UTC(1899,11,30)+nn*86400000);val=dd.toISOString().slice(0,10)}}
        while(rows.length<=ri)rows.push([]);

        rows[ri][col]=val}
      var w=0;rows.forEach(function(r){if(r.length>w)w=r.length});
      return rows.map(function(r){while(r.length<w)r.push("");return r}).filter(function(r){return r.some(function(y){return String(y).trim()!==""})})})})}

  var act=b.dataset.act;
  if(act==="cancel")return closeSheet();
  if(act==="depkind"){var dk0=document.getElementById("d_kind"),dm0=document.getElementById("d_manual");if(dk0)dk0.value=b.dataset.k;if(dm0)dm0.value="";depRecalc();return}
  if(act==="shotstop"){if(SHOT.ctl)SHOT.ctl.abort();closeSheet();return}
  if(act==="shotsave")return shotSave();
  if(act==="calpick"){var cp=S.trades.filter(function(x){return x.id===b.dataset.id})[0];if(cp)openSheet(tradeForm(cp));return}
  if(act==="lotssave"){
    var lm=val("l_month"),lv=num(val("l_val"));
    if(!/^\d{4}-\d{2}$/.test(lm)||!(lv>0)){toast(S.settings.lang==="de"?"Monat und Lots eintragen":"Enter month and lots");return}
    var ex2=S.tx.filter(function(x){return x.area==="biz"&&ymOf(x.date)===lm&&num(x.lots)>0&&num(x.amount)===0})[0];
    if(ex2)ex2.lots=String(lv);
    else{var ld=new Date(Date.UTC(+lm.slice(0,4),+lm.slice(5,7),0)).toISOString().slice(0,10);
      S.tx.push({id:uid(),date:ld,type:"in",cat:"",lots:String(lv),perlot:"",amount:"0",split:"1",cur:S.settings.home,area:"biz",model:"Vantage",paid:"paid",note:""})}
    save();closeSheet();render();toast(t("saved"));return}
  if(act==="csvgo"){var cx=csvRead(),nn=0;cx.rows.forEach(function(n){
      var dup=S.tx.some(function(o){return o.area==="biz"&&o.date===n.date&&num(o.amount)===num(n.amount)&&num(o.lots)===num(n.lots)&&(o.model||"")===n.model});
      if(!dup){n.id=uid();S.tx.push(n);nn++}});
    save();closeSheet();render();toast(nn+" "+t("csv_done"));return}
  if(act==="confirm"){var f=confirmSheet._fn;closeSheet();if(f)f();return}
  if(act==="savetrade"){
    var tr=readTrade();
    if(!tr.unit){toast(t("no_cash"));return}
    if(!tr.symbol){toast(t("symbol"));return}
    if(tr.pnl===""){toast(t("pnl"));return}
    if(tr.id){for(var q=0;q<S.trades.length;q++)if(S.trades[q].id===tr.id)S.trades[q]=tr}
    else{tr.id=uid();S.trades.push(tr)}
    save();closeSheet();render();toast(t("saved"));return;
  }
  if(act==="savedep"){
    var dd={id:val("d_id"),unit:val("d_unit"),date:val("d_date")||today(),amount:val("d_amount"),credit:val("d_credit"),note:(function(){var o=S.deposits.filter(function(x){return x.id===val("d_id")})[0];return o&&o.note?o.note:""})()};
    if(!dd.unit){toast(t("no_cash"));return}
    if(!(num(dd.amount)>0)){toast(t("cr_amount"));return}
    if(dd.credit==="")dd.credit=String(creditFor(dd.unit,dd.id,dd.date,num(dd.amount),val("d_kind")||undefined));
    dd.kind=val("d_kind")||"";
    if(dd.id){for(var q2=0;q2<S.deposits.length;q2++)if(S.deposits[q2].id===dd.id)S.deposits[q2]=dd}
    else{dd.id=uid();S.deposits.push(dd)}
    save();closeSheet();render();toast(t("saved"));return;
  }
  if(act==="deldep"){var xid=b.dataset.id;S.deposits=S.deposits.filter(function(x){return x.id!==xid});save();closeSheet();render();toast(t("deleted"));return}
  if(act==="saverec"){
    var rc=val("r_c"),C=COLL[rc],rr=readRec(rc),miss=false;
    if(rc==="tx"&&rr.area==="biz"&&String(rr.amount).trim()===""&&num(rr.lots)>0&&num(rr.perlot)>0)rr.amount=String(Math.round(num(rr.lots)*num(rr.perlot)*100)/100);
    C.f.forEach(function(f){if(f.req&&String(rr[f.k]).trim()==="")miss=true});
    if(miss){toast(S.settings.lang==="de"?"Pflichtfeld fehlt":"Required field missing");return}
    if(rc==="tx"&&(rr.area||"priv")==="priv")addCat(rr.cat,rr.type==="in"?"in":(rr.cost==="fix"?"fix":"var"));
    if(rc==="budgets")addCat(rr.cat,"var");
    if(rc==="subs"&&(rr.area||"priv")==="priv")addCat(rr.cat,"fix");
    if(rr.id){for(var z=0;z<S[rc].length;z++)if(S[rc][z].id===rr.id)S[rc][z]=Object.assign({},S[rc][z],rr)}else{rr.id=uid();S[rc].push(rr)}
    save();if(rc==="cats"){openSheet(catsSheet())}else closeSheet();render();toast(t("saved"));return;
  }
  if(act==="addrec"&&b.dataset.c==="cats"){PRESET={};openSheet(recForm("cats",null));return}
  if(act==="delcat"){S.cats=S.cats.filter(function(x){return x.id!==b.dataset.id});save();openSheet(catsSheet());render();return}
  if(act==="delrec"){var dc=b.dataset.c,di=b.dataset.id;S[dc]=S[dc].filter(function(x){return x.id!==di});save();closeSheet();render();toast(t("deleted"));return}
  if(act==="deltrade"){
    var did=b.dataset.id;
    S.trades=S.trades.filter(function(x){return x.id!==did});
    save();closeSheet();render();toast(t("deleted"));return;
  }
  if(act==="saveunit"){
    var u=readUnit();
    if(!u.name.trim()){toast(S.settings.lang==="de"?"Name fehlt":"Name missing");return}
    if(u.id){for(var i=0;i<S.units.length;i++)if(S.units[i].id===u.id)S.units[i]=u}
    else{u.id=uid();S.units.push(u)}
    save();closeSheet();render();toast(t("saved"));
  }
});
document.getElementById("view").addEventListener("click",function(e){
  var pbt=e.target.closest("button[data-tu]");
  if(pbt){state.tu=pbt.dataset.tu;render();return}
  var cd=e.target.closest(".cal .day[data-d]");
  if(cd){var dk=cd.dataset.d,dt=pTrades().filter(function(x){return x.date===dk});
    if(dt.length===1){openSheet(tradeForm(dt[0]));return}
    if(!dt.length){if(!cashUnits().length)return;openSheet(tradeForm(null));var di=document.getElementById("t_date");if(di)di.value=dk;return}
    openSheet('<h3>'+esc(dk)+'</h3><div class="tw"><table><tbody>'+dt.map(function(x){var cc=tCur(state.tu),q=pnlIn(x,cc);
      return '<tr><td><b>'+esc(x.symbol)+'</b> <span class="tag">'+esc(x.dir==="short"?t("short"):t("long"))+'</span></td><td class="r num">'+esc(q===null?"\u2014":fmt(q,cc))+'</td><td class="r"><button class="btn ghost sm" data-act="calpick" data-id="'+esc(x.id)+'">'+esc(t("edit"))+'</button></td></tr>'}).join("")+'</tbody></table></div>'+
      '<div class="sheet-actions"><button class="btn ghost" data-act="cancel">'+esc(t("cancel"))+'</button></div>');return}
  var sb=e.target.closest("button[data-sub]");
  if(sb){var pr=sb.dataset.sub.split(":");state.sub=state.sub||{};state.sub[pr[0]]=pr[1];render();return}
  if(!e.target.closest("button,a,input,select,textarea,label,summary")){
    var trw=e.target.closest("tbody tr"),eb=trw&&trw.querySelector('button[data-act^="edit"]');
    if(eb){eb.click();return}}
  var tb=e.target.closest("button[data-tf]");
  if(tb){state.tf=tb.dataset.tf;render();return}
  var b=e.target.closest("[data-act]");if(!b)return;
  var act=b.dataset.act;
  if(act==="ratesnow"){fetchRates(true);return}
  if(act==="gocur"){state.page="currencies";render();return}
  if(act==="cswap"){var cl=calcList(),cf=state.calc.from||S.settings.home,ct=state.calc.to||(cl.filter(function(x){return x!==cf})[0]||cf);state.calc.from=ct;state.calc.to=cf;render();return}
  if(act==="addrec"){PRESET={area:b.dataset.area,type:b.dataset.type,wkind:b.dataset.wkind};openSheet(recForm(b.dataset.c,null));PRESET={};return}
  if(act==="catsopen"){openSheet(catsSheet());return}
  if(act==="editrec"){var er=recById(b.dataset.c,b.dataset.id);if(er)openSheet(recForm(b.dataset.c,er));return}
  if(act==="goarea"){state.area=b.dataset.to;state.page="overview";render();return}
  if(act==="tmjump"){state.tm=b.dataset.ym;render();return}
  if(act==="mnav"){var mk=b.dataset.k;state[mk]=shiftYM(state[mk]||curYM(),+b.dataset.d);render();return}
  if(act==="adddep"){openSheet(depForm(null));return}
  if(act==="editdep"){var eid=b.dataset.id,fd=null;S.deposits.forEach(function(x){if(x.id===eid)fd=x});if(fd)openSheet(depForm(fd));return}
  if(act==="saverates_cr"){S.settings.credit={first:Math.max(0,num(val("cr_first"))),next:Math.max(0,num(val("cr_next")))};save();render();toast(t("saved"));return}
  if(act==="addtrade"){if(!cashUnits().length){openUnit(null);openUnit._rewire(null)}else openSheet(tradeForm(null));return}
  if(act==="edittrade"){var tid=b.dataset.id,found=null;
    S.trades.forEach(function(x){if(x.id===tid)found=x});
    if(found)openSheet(tradeForm(found));return}
  if(act==="add"){state.nk=b.dataset.kind||"";openUnit(null);state.nk="";openUnit._rewire(null);return}
  if(act==="edit"){openUnit(b.dataset.id);openUnit._rewire(b.dataset.id);return}
  if(act==="del"){var id=b.dataset.id;confirmSheet(t("del_q"),t("del_unit_p"),t("confirm_del"),function(){
      S.units=S.units.filter(function(x){return x.id!==id});S.trades=S.trades.filter(function(x){return x.unit!==id});S.deposits=S.deposits.filter(function(x){return x.unit!==id});save();render();toast(t("deleted"))});return}
  if(act==="addcur"){var c=val("newCur");if(c&&!S.settings.rates[c]){S.settings.rates[c]=0;S.settings.ratesDate=today();save();render()}return}
  if(act==="delcur"){var cc=b.dataset.cur;delete S.settings.rates[cc];if(state.cur===cc)state.cur=S.settings.home;save();render();return}
  if(act==="saverates"){
    var ins=document.querySelectorAll("input[data-rate]");
    for(var j=0;j<ins.length;j++){var v=parseFloat(ins[j].value);S.settings.rates[ins[j].dataset.rate]=isNaN(v)?0:v}
    var hc=document.getElementById("homeCur").value;
    if(hc!==S.settings.home){
      var div=S.settings.rates[hc];
      if(div>0){var nr={};Object.keys(S.settings.rates).forEach(function(k){nr[k]=S.settings.rates[k]/div});nr[hc]=1;S.settings.rates=nr;S.settings.home=hc;
        S.trades.forEach(function(tr){var f=parseFloat(tr.fx);if(f>0)tr.fx=f/div});
        if(!S.settings.rates[state.cur])state.cur=hc;}
      else{toast(S.settings.lang==="de"?"Für die neue Hauptwährung fehlt ein Kurs.":"The new home currency has no rate yet.");return}
    }
    S.settings.ratesDate=today();save();render();toast(t("saved"));return;
  }
  if(act==="savesettings"){
    S.settings.brand=val("setBrand")||"Checkmate";S.settings.sub=val("setSub");
    S.settings.lang=val("setLang");S.settings.theme=val("setTheme");
    save();applyTheme();render();toast(t("saved"));return;
  }
  if(act==="saveareas"){
    var na={priv:document.getElementById("ar_priv").checked,trade:document.getElementById("ar_trade").checked,crypto:document.getElementById("ar_crypto").checked,biz:document.getElementById("ar_biz").checked};
    if(!na.priv&&!na.trade&&!na.biz&&!na.crypto){toast(t("areas_min"));return}
    S.settings.areas=na;save();render();toast(t("saved"));return;
  }
  if(act==="export")return doExport();
  if(act==="shotpick")return document.getElementById("shotFile").click();
  if(act==="csvpick")return document.getElementById("csvFile").click();
  if(act==="lotsopen"){
    var ym0=state.month||curYM(),ex=S.tx.filter(function(x){return x.area==="biz"&&ymOf(x.date)===ym0&&num(x.lots)>0&&num(x.amount)===0})[0];
    return openSheet('<h3>'+esc(t("lots_btn"))+'</h3><p class="hint">'+esc(t("lots_hint"))+'</p><div class="grid2">'+
      '<label class="field"><span>'+esc(t("lots_month"))+'</span><input id="l_month" type="month" value="'+ym0+'"></label>'+
      '<label class="field"><span>'+esc(t("f_lots"))+'</span><input id="l_val" type="number" step="any" value="'+esc(ex?ex.lots:"")+'"></label></div>'+
      '<div class="sheet-actions"><button class="btn ghost" data-act="cancel">'+esc(t("cancel"))+'</button><button class="btn" data-act="lotssave">'+esc(t("save"))+'</button></div>')}
  if(act==="import")return document.getElementById("impFile").click();
  if(act==="demo")return loadDemo();
  if(act==="wipe")return confirmSheet(t("wipe"),t("wipe_p"),t("confirm_del"),function(){
    S=blank();save();state.cur="EUR";boot()});
});
document.addEventListener("change",function(e){
  if(e.target&&e.target.id==="impFile"&&e.target.files&&e.target.files[0])doImport(e.target.files[0]);
  if(e.target&&e.target.id==="shotFile"&&e.target.files&&e.target.files.length){var sf=Array.prototype.slice.call(e.target.files);e.target.value="";shotRun(sf);return}
  if(e.target&&e.target.id==="csvFile"&&e.target.files&&e.target.files[0]){csvOpen(e.target.files[0]);e.target.value=""}
  if(e.target&&/^c_/.test(e.target.id||""))csvPrev();
  if(e.target&&e.target.id==="tuSel"){state.tu=e.target.value;render()}
});
document.addEventListener("input",function(e){var id=e.target&&e.target.id;
  if(id&&id.indexOf("t_")===0)tradeCalc();
  if(id==="cAmt"){state.calc.amt=e.target.value;var cr=document.getElementById("cRes");if(cr)cr.innerHTML=calcResult();return}
  if(id==="d_credit"){var m=document.getElementById("d_manual");if(m)m.value=e.target.value===""?"":"1"}
  else if(id==="d_amount"||id==="d_date")depRecalc();
});
document.addEventListener("change",function(e){var id=e.target&&e.target.id;if(id&&id.indexOf("t_")===0)tradeCalc();if(id==="d_unit"||id==="d_date")depRecalc()});
document.addEventListener("change",function(e){var el=e.target;if(!el)return;
  if(el.id==="r_area"&&val("r_c")==="tx"){var dr=readRec("tx");if(dr.id){/* editing: keep */}dr.id=dr.id||"";openSheet(recForm("tx",dr));return}
  if(el.id==="cFrom"||el.id==="cTo"){state.calc[el.id==="cFrom"?"from":"to"]=el.value;var cr2=document.getElementById("cRes");if(cr2)cr2.innerHTML=calcResult()}
  else if(el.id==="mSel"){state.month=el.value;render()}
  else if(el.id==="mdSel"){state.model=el.value;render()}
  else if(el.id==="yrSel"){state.year=el.value;render()}
  else if(el.id==="dxIn"){state.extra=el.value;render()}
  else if(el.getAttribute&&el.getAttribute("data-rule")){var d=today(),l=S.ruleChecks[d]||[],id=el.getAttribute("data-rule");
    l=l.filter(function(x){return x!==id});if(el.checked)l.push(id);S.ruleChecks[d]=l;save();render()}
});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!document.getElementById("modal").hidden)closeSheet()});
if(window.matchMedia)window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){if(S.settings.theme==="auto")applyTheme()});
boot();
</script>
</body></html>
